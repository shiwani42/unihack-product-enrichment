<svg xmlns="http://www.w3.org/2000/svg" width="920" height="620" viewBox="0 0 920 620">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="36" y="42" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="600" fill="#1e293b" text-anchor="start">Where evidence comes from</text>
<text x="36" y="72" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#64748b" text-anchor="start">Manufacturer first. Shopping never. Fallback pages may fill attributes, not marketing.</text>
<rect x="50" y="110" width="360" height="72" rx="36.0" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
<text x="230.0" y="138" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1e293b" text-anchor="middle">1  Manufacturer site</text>
<text x="230.0" y="160" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1e293b" text-anchor="middle">specs · marketing · MFR URL</text>
<rect x="50" y="230" width="360" height="72" rx="36.0" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
<text x="230.0" y="258" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1e293b" text-anchor="middle">2  Family literature</text>
<text x="230.0" y="280" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1e293b" text-anchor="middle">same-parent manuals and PDPs</text>
<rect x="50" y="350" width="360" height="72" rx="36.0" fill="#fef9c3" stroke="#854d0e" stroke-width="2"/>
<text x="230.0" y="378" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1e293b" text-anchor="middle">3  Third-party catalogs</text>
<text x="230.0" y="400" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1e293b" text-anchor="middle">Energy Star · attributes only</text>
<rect x="50" y="470" width="360" height="72" rx="36.0" fill="#fef9c3" stroke="#854d0e" stroke-width="2"/>
<text x="230.0" y="498" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1e293b" text-anchor="middle">4  Distributors last</text>
<text x="230.0" y="520" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1e293b" text-anchor="middle">attributes only · never MFR URL</text>
<line x1="230" y1="182" x2="230" y2="222" stroke="#475569" stroke-width="2"/><polygon points="230,230 225,220 235,220" fill="#475569"/>
<rect x="198" y="195.0" width="64" height="20" rx="4" fill="#ffffff"/>
<text x="230" y="210.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#334155" text-anchor="middle">if thin</text>
<line x1="230" y1="302" x2="230" y2="342" stroke="#475569" stroke-width="2"/><polygon points="230,350 225,340 235,340" fill="#475569"/>
<rect x="198" y="315.0" width="64" height="20" rx="4" fill="#ffffff"/>
<text x="230" y="330.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#334155" text-anchor="middle">if thin</text>
<line x1="230" y1="422" x2="230" y2="462" stroke="#475569" stroke-width="2"/><polygon points="230,470 225,460 235,460" fill="#475569"/>
<rect x="198" y="435.0" width="64" height="20" rx="4" fill="#ffffff"/>
<text x="230" y="450.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#334155" text-anchor="middle">if thin</text>
<rect x="500" y="110" width="380" height="72" rx="36.0" fill="#fee2e2" stroke="#991b1b" stroke-width="2"/>
<text x="690" y="138" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1e293b" text-anchor="middle">Never: shopping</text>
<text x="690" y="160" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1e293b" text-anchor="middle">Amazon · Home Depot · eBay</text>
<text x="500" y="212" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#64748b" text-anchor="start">Blocked even if search returns the URL.</text>
<text x="36" y="588" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#64748b" text-anchor="start">Distributor confidence is capped. Marketing, images, and PDFs stay manufacturer-only.</text>
</svg>